services:

  # Jenkins Continuous Integration / Continuous Deployment server.
  # This container hosts the Jenkins web interface, manages build jobs,
  # executes pipelines, and automates application build, test, and deployment tasks.
  jenkins:
    build:
      # Builds the Jenkins image using the Dockerfile located in the ./jenkins directory.
      context: ./jenkins

    # Human-readable name assigned to the container.
    container_name: jenkins-server

    # Automatically restarts the container unless it is explicitly stopped.
    restart: unless-stopped

    ports:
      # Port 8080 provides access to the Jenkins web dashboard through a browser.
      # Format: HOST_PORT:CONTAINER_PORT
      - "8080:8080"

      # Port 50000 is used by Jenkins inbound agents/executors
      # to connect back to the Jenkins controller for distributed builds.
      - "50000:50000"

    environment:
      # Enables the Jenkins first-time setup wizard when the container starts.
      # This allows the administrator to perform the initial configuration manually.
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=true

    volumes:
      # Stores Jenkins configuration, job definitions, plugins, credentials,
      # workspace data, and build history persistently.
      # Without this volume, all Jenkins data would be lost when the container is removed.
      - jenkins_home:/var/jenkins_home

      # Mounts the host Docker socket inside the Jenkins container.
      # This allows Jenkins jobs to execute Docker CLI commands and manage
      # containers/images using the host Docker daemon.
      - /var/run/docker
